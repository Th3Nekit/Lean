name: Lean Android APKs

on:
  push:
    branches:
      - main
      - codex/lean-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish all APKs as a private test prerelease
        required: true
        default: true
        type: boolean

concurrency:
  group: lean-apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: "35"
  NEKO_ANDROID_API: "21"
  NEKO_NDK_VERSION: "25.0.8775105"
  AWG_NDK_VERSION: "26.1.10909125"

jobs:
  build:
    name: Build and publish all APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout Veil
        uses: actions/checkout@v4

      # Corner radii and type sizes stopped being constants when «Оформление» shipped —
      # they are resolved per user at runtime. A literal left behind still compiles, still
      # looks correct under the default theme, and is simply the one widget in the app that
      # ignores the user's setting: invisible in review, invisible in testing until someone
      # moves the knob. Today's discipline (zero inline TextStyle, zero stray .sp, zero raw
      # radii) is an agreement, and an agreement is what this step replaces.
      #
      # Placed before the toolchain steps on purpose: it needs nothing but the source tree,
      # so a violation costs seconds instead of the ~40 minutes of native build that would
      # otherwise run before Gradle ever looks at the Kotlin.
      - name: Guard appearance tokens
        shell: bash
        run: |
          set -euo pipefail

          shape_kt='app/src/main/java/com/th3web/lean/ui/theme/Shape.kt'
          type_kt='app/src/main/java/com/th3web/lean/ui/theme/Type.kt'
          preview_kt='app/src/main/java/com/th3web/lean/ui/screen/appearance/AppearancePreview.kt'

          # Renaming any of the three would otherwise turn an exemption into a hole, or the
          # preview rule into a no-op, with nothing going red.
          for anchor in "${shape_kt}" "${type_kt}" "${preview_kt}"; do
            test -f "${anchor}" || { echo "::error::appearance gate: anchor file is missing: ${anchor}"; exit 1; }
          done

          # --others --exclude-standard adds files that are new but not yet committed. In CI
          # that is a no-op (checkout is fully tracked); it is what makes the same script
          # usable as a pre-commit check, where a brand-new screen is exactly the file most
          # likely to carry a stray literal. .gitignore keeps build output out either way.
          mapfile -t all_kt < <(git ls-files --cached --others --exclude-standard '*.kt')
          # An empty list would leave grep with no file arguments, and it would then block on
          # stdin until the job times out rather than failing.
          [ "${#all_kt[@]}" -gt 0 ] || { echo "::error::appearance gate: no Kotlin sources found"; exit 1; }
          mapfile -t but_shape < <(printf '%s\n' "${all_kt[@]}" | grep -vxF "${shape_kt}")
          mapfile -t but_type < <(printf '%s\n' "${all_kt[@]}" | grep -vxF "${type_kt}")

          # Every rule is evaluated before exiting, so one CI round reports every violation.
          fail=0
          gate() {
            local rule="$1" pattern="$2" why="$3"
            shift 3
            local hits
            hits="$(grep -nHE "${pattern}" "$@" || true)"
            if [ -n "${hits}" ]; then
              echo "::error::appearance gate — ${rule}"
              printf '%s\n' "${hits}"
              printf '%s\n\n' "${why}"
              fail=1
            fi
          }

          gate 'raw RoundedCornerShape(N.dp) outside ui/theme/Shape.kt' \
            'RoundedCornerShape\(\s*[0-9.]+\.dp' \
            'corner_style repoints the whole ladder at runtime, so a hardcoded radius is the one shape in the app that never follows it. Use a LeanCorner token, read INSIDE the composable.' \
            "${but_shape[@]}"

          gate 'TextStyle(...) or a bare N.sp outside ui/theme/Type.kt' \
            'TextStyle\(|\b[0-9.]+\.sp\b' \
            'text_scale and font_weight_delta rebuild every role in Type.kt; an inline TextStyle or a fixed sp size is text that silently opts out of both. Add or reuse a LeanType role.' \
            "${but_type[@]}"

          gate 'AppearancePreview reads a global theme token' \
            'LeanColors\.|LeanCorner\.|LeanType\.|LeanMetrics\.' \
            'The preview must render the DRAFT AppearanceSpec it is handed. Reading a global draws the LIVE theme instead, so the preview contradicts the slider being dragged right above it.' \
            "${preview_kt}"

          gate 'top-level private val captured from a Lean* token object' \
            '^private val \w+ = Lean(Colors|Corner|Metrics|Options|Type)\.' \
            'Those objects are snapshot state. A file-level val reads one once at class load and freezes on whichever theme happened to load first: compiles clean, warns about nothing, misbehaves only after the user changes a setting. ServerRow shipped exactly this bug twice. Read the token inside the composable.' \
            "${all_kt[@]}"

          [ "${fail}" -eq 0 ] || exit 1
          echo "Appearance token gate: all four rules clean across ${#all_kt[@]} Kotlin files."

      # This job now builds three native things in one runner — the Neko AAR, AmneziaWG
      # and the olcRTC helper — and the last one brings its own Go toolchain plus a module
      # cache measured in gigabytes (livekit, pion, cel-go and the rest). Adding it made
      # the runner die mid-Gradle with no log uploaded at all, which is what running out
      # of disk looks like from the outside. None of the toolchains removed here are used
      # by this build; the Android SDK and NDK are deliberately untouched.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          echo "after:"; df -h / | tail -1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Neko toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${NEKO_ANDROID_API}" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "ndk;${NEKO_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NEKO_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NEKO_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Cache verified native inputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/lean-native/archives
            ${{ runner.temp }}/lean-native/go-archives
            ${{ runner.temp }}/lean-native/gomodcache
            ${{ runner.temp }}/lean-native/gocache
            ${{ runner.temp }}/lean-native/gopath/pkg
            ${{ runner.temp }}/lean-olcrtc/archives
            ${{ runner.temp }}/lean-olcrtc/gomodcache
            ${{ runner.temp }}/lean-olcrtc/gocache
          key: neko-native-${{ runner.os }}-${{ hashFiles('native/versions.lock', 'native/neko/**/*.ps1', 'native/neko/aar-contract.txt', 'native/plugins/*.ps1') }}

      - name: Test native build policy
        shell: pwsh
        run: |
          ./native/neko/tests/build-policy.tests.ps1
          ./native/neko/tests/reproducibility-gates.tests.ps1

      - name: Build and inspect pinned Neko AAR
        shell: pwsh
        run: |
          ./native/neko/build.ps1 `
            -NativeWorkRoot "${{ runner.temp }}/lean-native" `
            -ValidatorOutputPath "${{ github.workspace }}/artifacts/sing-box"
          ./native/neko/tests/elf-contract.tests.ps1
          ./native/neko/tests/aar-contract.tests.ps1
          if (-not (Test-Path -LiteralPath artifacts/sing-box -PathType Leaf)) {
            throw "Matsuri validator artifact is missing."
          }

      - name: Vendor pinned protocol helpers (naive, mieru, xray)
        shell: pwsh
        run: |
          ./native/plugins/vendor.ps1 -DownloadRoot "${{ runner.temp }}/lean-plugins"
          # The binaries ARE the feature: a build that silently shipped without them
          # would install fine and then fail at connect time, which is exactly the
          # failure mode worth catching here instead of on a user's phone.
          foreach ($abi in @("armeabi-v7a", "arm64-v8a", "x86", "x86_64")) {
            $naive = "app/src/main/jniLibs/$abi/libnaive.so"
            if (-not (Test-Path -LiteralPath $naive -PathType Leaf)) {
              throw "missing $naive"
            }
          }
          # mieru is arm64-only upstream — assert exactly that, so the day another ABI
          # appears (or arm64 disappears) this fails loudly rather than shipping a gap.
          if (-not (Test-Path -LiteralPath "app/src/main/jniLibs/arm64-v8a/libmieru.so" -PathType Leaf)) {
            throw "missing app/src/main/jniLibs/arm64-v8a/libmieru.so"
          }
          foreach ($abi in @("armeabi-v7a", "x86", "x86_64")) {
            if (Test-Path -LiteralPath "app/src/main/jniLibs/$abi/libmieru.so" -PathType Leaf) {
              throw "unexpected mieru binary for $abi — update NativePlugin's availability check"
            }
          }
          # xray is shipped for arm64 only too: upstream also publishes android-amd64,
          # but that ABI is emulators, and 35 MB of helper is not worth carrying for them.
          if (-not (Test-Path -LiteralPath "app/src/main/jniLibs/arm64-v8a/libxray.so" -PathType Leaf)) {
            throw "missing app/src/main/jniLibs/arm64-v8a/libxray.so"
          }
          foreach ($abi in @("armeabi-v7a", "x86", "x86_64")) {
            if (Test-Path -LiteralPath "app/src/main/jniLibs/$abi/libxray.so" -PathType Leaf) {
              throw "unexpected xray binary for $abi — update NativePlugin's availability check"
            }
          }

      # olcRTC has no releases to download, so it is compiled from a pinned commit with a
      # pinned Go. arm64 only: Go links android/arm, android/386 and android/amd64 through
      # an external (cgo) linker and refuses with CGO off, so those ABIs genuinely have no
      # build — the same situation mieru is in, and the app already says so rather than
      # failing at connect time.
      - name: Build pinned olcRTC helper
        shell: pwsh
        run: |
          ./native/plugins/build-olcrtc.ps1 -WorkRoot "${{ runner.temp }}/lean-olcrtc"
          if (-not (Test-Path -LiteralPath "app/src/main/jniLibs/arm64-v8a/libolcrtc.so" -PathType Leaf)) {
            throw "missing app/src/main/jniLibs/arm64-v8a/libolcrtc.so"
          }
          foreach ($abi in @("armeabi-v7a", "x86", "x86_64")) {
            if (Test-Path -LiteralPath "app/src/main/jniLibs/$abi/libolcrtc.so" -PathType Leaf) {
              throw "unexpected olcrtc binary for $abi — update NativePlugin's availability check"
            }
          }

      - name: Install pinned AmneziaWG toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${AWG_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${AWG_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${AWG_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_B64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" ]]; then
            keystore="${RUNNER_TEMP}/lean-release.p12"
            printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > "${keystore}"
            echo "ANDROID_KEYSTORE_FILE=${keystore}" >> "${GITHUB_ENV}"
            echo "SIGNING_MODE=release" >> "${GITHUB_ENV}"
          elif [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "::error::Release signing secrets are incomplete."
            exit 1
          else
            echo "SIGNING_MODE=debug-fallback" >> "${GITHUB_ENV}"
          fi

      - name: Test, lint, and assemble every APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            :amneziawg-core:test \
            :app:testFullDebugUnitTest \
            :app:lintFullDebug \
            :app:assembleFullDebug \
            :app:assembleFullRelease \
            :app:assembleFossRelease

      # RESTORED GUARD (was dropped during the runtime migration; its absence is why a
      # config the core refuses at start-time could still ship on a green build). The
      # validator here is the PINNED Matsuri core itself (artifacts/sing-box, built above
      # from the same revision embedded in libgojni.so), so this is strictly stronger than
      # the old stock-SagerNet-CLI gate: `check` catches schema drift, and the smoke `run`
      # catches start-time failures that `check` alone cannot see.
      - name: Validate generated configs with the pinned core
        shell: bash
        run: |
          set -euo pipefail
          validator="${GITHUB_WORKSPACE}/artifacts/sing-box"
          chmod +x "${validator}"
          shopt -s nullglob
          cfgs=(app/build/generated-configs/*.json)
          if [ "${#cfgs[@]}" -eq 0 ]; then
            echo "::error::no generated configs found — SingBoxConfigTest no longer emits them"
            exit 1
          fi
          for f in "${cfgs[@]}"; do
            echo "== check ${f} =="
            "${validator}" check -c "${f}"
          done
          echo "All ${#cfgs[@]} generated configs passed check."

      - name: Smoke-run generated configs with the pinned core
        shell: bash
        run: |
          set -euo pipefail
          validator="${GITHUB_WORKSPACE}/artifacts/sing-box"
          shopt -s nullglob
          cfgs=(app/build/generated-configs/smoke/*.json)
          if [ "${#cfgs[@]}" -eq 0 ]; then
            echo "::error::no smoke configs found"
            exit 1
          fi
          fail=0
          for f in "${cfgs[@]}"; do
            echo "== run-smoke ${f} =="
            out="$(timeout 6 "${validator}" run -c "${f}" 2>&1 || true)"
            if printf '%s' "${out}" | grep -qiE 'FATAL|panic:'; then
              echo "::error::smoke start failed for ${f}"
              printf '%s\n' "${out}"
              fail=1
            fi
          done
          [ "${fail}" -eq 0 ] || { echo "one or more configs failed to start"; exit 1; }
          echo "All ${#cfgs[@]} smoke configs started cleanly."

      - name: Verify signatures and native ABI matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/full -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 10 ]]; then
            printf 'Expected 10 APKs, found %s:\n%s\n' "${#apks[@]}" "${apks[*]}"
            exit 1
          fi

          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner}"
          for apk in "${apks[@]}"; do
            "${apksigner}" verify "${apk}"
          done

          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for build_type in debug release; do
            universal="app/build/outputs/apk/full/${build_type}/app-full-universal-${build_type}.apk"
            for abi in "${abis[@]}"; do
              split="app/build/outputs/apk/full/${build_type}/app-full-${abi}-${build_type}.apk"
              test -f "${split}"
              unzip -Z1 "${split}" | grep -qx "lib/${abi}/libwg-go.so"
              unzip -Z1 "${split}" | grep -qx "lib/${abi}/libgojni.so"
              unzip -Z1 "${universal}" | grep -qx "lib/${abi}/libwg-go.so"
              unzip -Z1 "${universal}" | grep -qx "lib/${abi}/libgojni.so"
              # naive ships for every ABI; the other three helpers are arm64-only
              # upstream, and the app SAYS SO at connect time rather than failing
              # cryptically. Asserting the packaging here — not just the vendoring —
              # is what catches an abiFilter or a useLegacyPackaging flip turning a
              # shipped binary into one that is present but cannot be exec'd.
              unzip -Z1 "${split}" | grep -qx "lib/${abi}/libnaive.so"
              for helper in libmieru.so libolcrtc.so libxray.so; do
                if [[ "${abi}" == "arm64-v8a" ]]; then
                  unzip -Z1 "${split}" | grep -qx "lib/${abi}/${helper}"
                  unzip -Z1 "${universal}" | grep -qx "lib/${abi}/${helper}"
                elif unzip -Z1 "${split}" | grep -qx "lib/${abi}/${helper}"; then
                  echo "unexpected ${helper} in the ${abi} split" >&2
                  exit 1
                fi
              done
            done
          done

          # The foss flavour is the one F-Droid can build, and its whole promise is that
          # it carries no downloaded executable. Asserted here, because a packaging rule
          # that quietly stops matching would ship them anyway.
          foss="app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk"
          test -f "${foss}"
          if unzip -Z1 "${foss}" | grep -q "libnaive.so"; then
            echo "foss build must not carry libnaive.so (Chromium, not buildable from source here)" >&2
            exit 1
          fi
          # Everything else IS buildable from source and must be present, or the
          # flavour quietly becomes a lesser app rather than a from-source one.
          for present in libgojni.so libwg-go.so libmieru.so libxray.so libolcrtc.so; do
            unzip -Z1 "${foss}" | grep -qx "lib/arm64-v8a/${present}"               || { echo "foss build is missing ${present}" >&2; exit 1; }
          done
          echo "foss release APK verified: everything but NaiveProxy"

          # Reported, not gated: the helpers are most of the arm64 APK, and a jump
          # in this number should be a decision rather than a surprise.
          for abi in "${abis[@]}"; do
            size="$(du -h "app/build/outputs/apk/full/release/app-full-${abi}-release.apk" | cut -f1)"
            echo "${abi} release APK: ${size}"
          done

      - name: Prepare versioned distribution
        id: distribution
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          test -n "${version}"
          mkdir -p dist
          for build_type in debug release; do
            for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
              source="app/build/outputs/apk/full/${build_type}/app-full-${abi}-${build_type}.apk"
              target="dist/Lean-${version}-${build_type}-${abi}.apk"
              test -f "${source}"
              cp "${source}" "${target}"
            done
          done
          # The R8 mapping, without which a release crash report is unreadable. The
          # release build is minified, so every submitted stack trace arrives as
          # n.f.create / z2.B.x and cannot be tied back to any source — a real OOM
          # report came in exactly like that and could only be reasoned about, not read.
          mapping="app/build/outputs/mapping/fullRelease/mapping.txt"
          if [ -f "${mapping}" ]; then
            cp "${mapping}" "dist/Lean-${version}-mapping.txt"
          fi
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS.txt
          )
          jq -n \
            --arg version "${version}" \
            --arg commit "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg run "${GITHUB_RUN_NUMBER}" \
            --arg signing "${SIGNING_MODE}" \
            '{
              version: $version,
              commit: $commit,
              ref: $ref,
              run: ($run | tonumber),
              signing: $signing,
              variants: ["armeabi-v7a", "arm64-v8a", "x86", "x86_64", "universal"],
              buildTypes: ["debug", "release"]
            }' > dist/build-info.json
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=veil-v${version}-ci.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Publish private test prerelease
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.distribution.outputs.tag }}
          RELEASE_VERSION: ${{ steps.distribution.outputs.version }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Automated private test build of Lean ${RELEASE_VERSION}.

          Commit: \`${GITHUB_SHA}\`
          Branch: \`${GITHUB_REF_NAME}\`
          Signing: \`${SIGNING_MODE}\`

          Includes debug and release APKs for armeabi-v7a, arm64-v8a, x86, x86_64, and universal.
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Lean ${RELEASE_VERSION} CI #${GITHUB_RUN_NUMBER}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --prerelease
            gh release upload "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              dist/*.apk dist/SHA256SUMS.txt dist/build-info.json dist/*mapping.txt
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Lean ${RELEASE_VERSION} CI #${GITHUB_RUN_NUMBER}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --prerelease \
              dist/*.apk dist/SHA256SUMS.txt dist/build-info.json dist/*mapping.txt
          fi
